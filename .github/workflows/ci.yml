# 给这个自动化流程起个名字
name: Python CI Pipeline

# 触发条件：当代码推送到 main 分支，或者提交 Pull Request 时自动运行
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 定义具体要执行的任务
jobs:
  build-and-test:
    runs-on: ubuntu-latest  # 在最新的 Ubuntu 系统上运行

    steps:
      # 1. 自动拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 你可以根据需要改成 3.9 或 3.11

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 如果你没有这个文件，可以注释掉这行

      # 4. 运行测试（假设你的测试文件叫 test_app.py）
      - name: Run tests
        run: |
          python -m pytest test_app.py
